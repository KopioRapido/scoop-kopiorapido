name: Auto-Update Scoop Manifests

on:
  repository_dispatch:
    types: [update-scoop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., 2026.02.07)'
        required: true
      win_x64_sha256:
        description: 'SHA256 for Windows x64 CLI'
        required: true
      win_arm64_sha256:
        description: 'SHA256 for Windows ARM64 CLI'
        required: true
      gui_win_x64_sha256:
        description: 'SHA256 for Windows x64 GUI (no longer released — optional)'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Get version from dispatch or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            echo "win_x64_sha256=${{ github.event.client_payload.win_x64_sha256 }}" >> $GITHUB_OUTPUT
            echo "win_arm64_sha256=${{ github.event.client_payload.win_arm64_sha256 }}" >> $GITHUB_OUTPUT
            echo "gui_win_x64_sha256=${{ github.event.client_payload.gui_win_x64_sha256 }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "win_x64_sha256=${{ github.event.inputs.win_x64_sha256 }}" >> $GITHUB_OUTPUT
            echo "win_arm64_sha256=${{ github.event.inputs.win_arm64_sha256 }}" >> $GITHUB_OUTPUT
            echo "gui_win_x64_sha256=${{ github.event.inputs.gui_win_x64_sha256 }}" >> $GITHUB_OUTPUT
          fi

      - name: Update CLI manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          version = "${{ steps.get_version.outputs.version }}"
          x64_sha = "${{ steps.get_version.outputs.win_x64_sha256 }}"
          arm64_sha = "${{ steps.get_version.outputs.win_arm64_sha256 }}"
          path = pathlib.Path('bucket/kopiorapido.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = version
          for arch, tag, sha in (('64bit', 'x64', x64_sha), ('arm64', 'arm64', arm64_sha)):
              manifest['architecture'][arch]['url'] = f"https://releases.kopiorapido.com/{version}/cli/kopiorapido-cli-win-{tag}-{version}.zip"
              manifest['architecture'][arch]['hash'] = sha
          path.write_text(json.dumps(manifest, indent=4) + '\n')
          PY

      - name: Update GUI manifest
        if: hashFiles('bucket/kopiorapido-gui.json') != ''
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          GUI_SHA="${{ steps.get_version.outputs.gui_win_x64_sha256 }}"

          # Update kopiorapido-gui.json (skipped when no GUI manifest exists)
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" bucket/kopiorapido-gui.json
          sed -i "s/\"hash\": \".*\"/\"hash\": \"$GUI_SHA\"/" bucket/kopiorapido-gui.json

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add bucket/*.json
          git commit -m "chore: update to version ${{ steps.get_version.outputs.version }}" || exit 0
          git pull --rebase origin main
          git push
